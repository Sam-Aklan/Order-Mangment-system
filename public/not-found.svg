<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="600" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">404 Not Found illustration</title>
  <desc id="desc">Playful 404 scene with a lost map and magnifier. Colors: primary #ffe0c2, secondary #393028, accent #2a2a2a.</desc>

  <!-- Colors as variables (for clarity) -->
  <defs>
    <style>
      .bg { fill: #ffe0c2; }        /* primary */
      .fill-main { fill: #393028; } /* secondary */
      .stroke { stroke: #2a2a2a; }   /* accent */
      .muted { fill: rgba(58,48,40,0.12); } /* subtle shadow */
      .mono { font-family: "Inter", "Helvetica Neue", Arial, sans-serif; font-weight: 700; }
    </style>

    <!-- subtle paper texture pattern -->
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="transparent"/>
      <circle cx="3" cy="3" r="0.8" fill="#f3d9c2" />
      <circle cx="15" cy="15" r="0.8" fill="#f3d9c2" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect class="bg" x="0" y="0" width="1200" height="600"/>

  <!-- Ground shadow -->
  <ellipse class="muted" cx="600" cy="480" rx="320" ry="40" />

  <!-- Left: tilted folder (map) -->
  <g transform="translate(160,180) rotate(-8)">
    <!-- folder base -->
    <rect x="0" y="0" width="360" height="220" rx="14" fill="#fff7ee" stroke="#2a2a2a" stroke-width="3"/>
    <!-- folder flap -->
    <path d="M0 0 L110 -36 L360 -36 L360 0 Z" fill="#fff0e0" stroke="#2a2a2a" stroke-width="3"/>
    <!-- map lines -->
    <g transform="translate(36,40)" stroke="#393028" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 10 C40 0, 70 30, 120 20" opacity="0.85"/>
      <path d="M8 60 C48 50, 72 80, 132 68" opacity="0.6"/>
      <path d="M20 30 L28 34 L24 42" />
      <circle cx="180" cy="70" r="8" fill="#393028"/>
    </g>
    <!-- paper texture -->
    <rect x="8" y="12" width="344" height="196" rx="10" fill="url(#dots)" opacity="0.18"/>
  </g>

  <!-- Right: magnifier inspecting a tiny route -->
  <g transform="translate(760,210)">
    <!-- lens -->
    <circle cx="64" cy="64" r="64" fill="#fff7ee" stroke="#2a2a2a" stroke-width="6"/>
    <!-- inner glass -->
    <circle cx="64" cy="64" r="44" fill="#ffe9d9" stroke="#393028" stroke-width="2" opacity="0.97"/>
    <!-- handle -->
    <rect x="118" y="118" width="110" height="18" rx="9" fill="#393028" transform="rotate(30 118 118)" />
    <rect x="118" y="118" width="110" height="12" rx="6" fill="#2a2a2a" transform="rotate(30 118 118)" opacity="0.08"/>
    <!-- tiny route under lens -->
    <g transform="translate(40,44)" stroke="#393028" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 10 C12 0, 28 18, 48 12" />
      <path d="M12 0 L14 -6 L20 0" />
      <circle cx="48" cy="12" r="4" fill="#393028"/>
    </g>
    <!-- magnifier highlight -->
    <ellipse cx="48" cy="36" rx="20" ry="9" fill="white" opacity="0.14"/>
  </g>

  <!-- Center: Large 404 text -->
  <g transform="translate(300,80)">
    <text x="300" y="210" class="mono fill-main" font-size="160" letter-spacing="6" text-anchor="middle">404</text>

    <!-- subtitle/message -->
    <text x="300" y="290" fill="#393028" font-family="Inter, Arial, sans-serif" font-size="28" text-anchor="middle" font-weight="600">
      Page not found
    </text>

    <!-- small explanation line -->
    <text x="300" y="324" fill="#2a2a2a" font-family="Inter, Arial, sans-serif" font-size="16" text-anchor="middle" opacity="0.9">
      The page you’re looking for may have wandered off the map.
    </text>

    <!-- simple button (visual only) -->
   
  </g>

  <!-- small corner decoration -->
 
</svg>
