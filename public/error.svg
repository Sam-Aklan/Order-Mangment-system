<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="600" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Unexpected Error Illustration</title>
  <desc id="desc">A broken robot with sparks indicating an unexpected system error. Colors: primary #ffe0c2, secondary #393028, accent #2a2a2a.</desc>

  <defs>
    <style>
      .bg { fill: #ffe0c2; }
      .main { fill: #393028; }
      .accent { stroke: #2a2a2a; }
      .mono { font-family: "Inter", "Helvetica Neue", Arial, sans-serif; font-weight: 700; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="1200" height="600"/>

  <!-- Shadow -->
  <ellipse cx="600" cy="500" rx="300" ry="40" fill="rgba(0,0,0,0.07)" />

  <!-- Broken Robot -->
  <g transform="translate(420,160)">
    <!-- Body -->
    <rect x="0" y="60" width="360" height="200" rx="25" fill="#fff7ee" stroke="#2a2a2a" stroke-width="5"/>

    <!-- Head -->
    <rect x="90" y="0" width="180" height="110" rx="20" fill="#fff7ee" stroke="#2a2a2a" stroke-width="5"/>

    <!-- Eyes (one broken) -->
    <circle cx="140" cy="55" r="16" fill="#393028"/>
    <path d="M220 40 L240 70 M240 40 L220 70" stroke="#393028" stroke-width="6" stroke-linecap="round"/>

    <!-- Mouth -->
    <rect x="130" y="85" width="100" height="14" rx="7" fill="#393028"/>

    <!-- Antenna -->
    <line x1="180" y1="-20" x2="180" y2="0" stroke="#2a2a2a" stroke-width="5"/>
    <circle cx="180" cy="-28" r="8" fill="#393028"/>

    <!-- Left Arm (fallen off) -->
    <rect x="-60" y="120" width="60" height="26" rx="13" fill="#393028" transform="rotate(-30 -60 120)" />
    <circle cx="-72" cy="132" r="10" fill="#2a2a2a"/>

    <!-- Right Arm (attached, broken angle) -->
    <rect x="360" y="130" width="60" height="26" rx="13" fill="#393028" transform="rotate(25 360 130)" />
    <circle cx="430" cy="143" r="10" fill="#2a2a2a"/>

    <!-- Sparks -->
    <g stroke="#393028" stroke-width="5" stroke-linecap="round">
      <line x1="180" y1="260" x2="180" y2="290"/>
      <line x1="165" y1="270" x2="150" y2="295"/>
      <line x1="195" y1="270" x2="210" y2="295"/>
    </g>

    <!-- Crack on body -->
    <path d="M150 120 L160 150 L145 170 L165 190" stroke="#2a2a2a" stroke-width="4" fill="none"/>
  </g>

  <!-- Text -->
  <g transform="translate(0,0)">
    <text x="600" y="410" font-size="80" text-anchor="middle" class="main mono">Unexpected Error</text>

    <text x="600" y="460" font-size="26" text-anchor="middle" fill="#2a2a2a">
      Something broke internally — please try again later.
    </text>
  </g>
</svg>
